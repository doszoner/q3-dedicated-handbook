// CPMA 1.53 CPM release profile; the historical profile id is unchanged.
// Common settings only; the entrypoint owns mode_start, g_gametype,
// map_cfgdir and sv_maxclients via command line, applied before this runs.
// server_gameplay (CPM or VQ3 physics) comes from GAMEPLAY via the entrypoint.
set server_useMapModes 0
// CPMA removed timelimit/fraglimit/scorelimit as server cvars: arena limits
// come from the mode's map_cfgdir lists and per-map cfg files. map_cfgdir
// and map_rotate are set per MODE and maplist by the entrypoint command line.
// Only the packaged mode lists name playable maps; arena files of whole
// map packages do not add their other BSPs.
set map_restrict 1
set g_allowVote 0
set bot_enable 0
set bot_minplayers 0
set sv_fps 20
set snaps 20
set cl_maxpackets 125
set com_maxfps 125
set sv_pure 0
set sv_allowDownload 0
// Network ownership belongs to the native entrypoint; browser defaults are separate.
