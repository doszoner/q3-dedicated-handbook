// Сервер читает этот файл при каждом старте.
// Чтобы применить правку: docker compose up -d --force-recreate q3ded

// Пароль rcon. Если строка закомментирована, rcon выключен.
// Чтобы включить: уберите // и замените CHANGE_ME своим паролем.
// set rconPassword "CHANGE_ME"

// Выкидывать игрока, который столько секунд не двигается и не стреляет (0 выключает).
set g_inactivity 90
