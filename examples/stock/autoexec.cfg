// Правила игры. Сервер читает этот файл при каждом старте.
// Чтобы применить правку: docker compose up -d --force-recreate q3ded
// Эти переменные здесь не действуют, их задают образ и compose.yaml: sv_hostname, sv_maxclients, g_gametype,
// timelimit, fraglimit, sv_allowDownload, sv_dlRate, sv_pure, sv_fps, bot_enable, g_allowVote, g_doWarmup.

// Пароль rcon. Если строка закомментирована, rcon выключен.
// Чтобы включить: уберите // и замените CHANGE_ME своим паролем.
// set rconPassword "CHANGE_ME"

// Выкидывать игрока, который столько секунд не двигается и не стреляет (0 выключает).
set g_inactivity 90

// Сообщение, которое игрок видит при входе.
set g_motd "Welcome!"
